<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traderwin Bot Sales Admin</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#080d17;color:#f4f6fa;font:15px Arial,sans-serif}main{max-width:1000px;margin:auto}.card{background:#111b2b;border:1px solid #29394f;border-radius:12px;padding:18px;margin:14px 0}.field{display:grid;gap:7px;margin:12px 0}input{padding:12px;border-radius:7px;background:#08111e;border:1px solid #394a60;color:white;width:100%}button{padding:11px 15px;background:#f5bd45;border:0;border-radius:7px;font-weight:bold}button:disabled{opacity:.5}.muted{color:#9eabc0;line-height:1.6}.order{border-top:1px solid #29394f;padding:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row button{margin-left:auto}.status{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><h1>Traderwin · Bot Sales Admin</h1><p class="muted">Private tool. Admin token is held only in this page's memory and is not saved in browser storage. Verify each M-Pesa payment in your official merchant statement before issuing a license.</p>
<section class="card"><div class="field"><label for="token">Admin access token</label><input id="token" type="password" autocomplete="off"></div><button id="load">Load orders</button><p id="status" class="muted" role="status"></p></section>
<section class="card"><h2>Orders</h2><div id="orders" class="muted">Authenticate to view orders.</div></section>
<section class="card"><h2>Issue license</h2><div class="field"><label for="orderId">Selected order ID</label><input id="orderId" readonly></div><div class="field"><label for="paymentRef">Confirmed M-Pesa transaction code</label><input id="paymentRef" maxlength="80"></div><button id="fulfill">Confirm payment & issue license</button><p id="issued" class="status" role="status"></p></section>
</main><script>
const token=document.getElementById("token"),status=document.getElementById("status"),orders=document.getElementById("orders");
async function call(method,body){const r=await fetch("/api/admin/bot-license-fulfill",{method,headers:{"x-traderwin-admin-token":token.value,"Content-Type":"application/json"},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
document.getElementById("load").onclick=async()=>{status.textContent="Loading…";try{const d=await call("GET");orders.innerHTML="";if(!d.orders.length){orders.textContent="No orders yet.";return;}for(const o of d.orders){const el=document.createElement("div");el.className="order";const info=document.createElement("div");info.textContent=o.customer_name+" · "+o.product_code+" · KSh "+Number(o.amount_kes).toLocaleString()+" · "+o.status+" · "+o.customer_phone+" · "+o.customer_email+" · "+o.id;el.append(info);const b=document.createElement("button");b.textContent="Select order";b.onclick=()=>{document.getElementById("orderId").value=o.id;status.textContent="Selected "+o.id;};el.append(b);orders.append(el);}status.textContent="Loaded "+d.orders.length+" recent orders.";}catch(e){status.textContent=e.message;}};
document.getElementById("fulfill").onclick=async()=>{const btn=document.getElementById("fulfill"),out=document.getElementById("issued");btn.disabled=true;out.textContent="Processing…";try{const d=await call("POST",{orderId:document.getElementById("orderId").value,paymentReference:document.getElementById("paymentRef").value});out.textContent=d.licenseKey?"LICENSE KEY (copy now; shown once): "+d.licenseKey+"\nCustomer: "+d.customerEmail+"\nType: "+d.license.license_type+"\nExpiry: "+(d.license.expires_at||"Lifetime"):"Already issued: "+JSON.stringify(d.license);}catch(e){out.textContent=e.message;}finally{btn.disabled=false;}};
</script></body></html>
