name: Tiger Scheme Cloudflare Pages build

on:
  pull_request:
    branches:
      - upgrade/full-platform-build
    paths:
      - "**.html"
      - "scripts/**"
      - "package.json"
      - "wrangler.toml"
      - ".github/workflows/tiger-scheme-pages.yml"
  push:
    branches:
      - feature/tiger-scheme-cloudflare
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing test suite
        run: npm test
      - name: Build Cloudflare Pages static site
        run: npm run build
      - name: Verify public bundle
        run: |
          test -f dist/index.html
          test -f dist/auth.html
          test -f dist/onboarding.html
          test -f dist/bot-shop.html
          test ! -d dist/api
          test ! -d dist/supabase
          test ! -d dist/lib
          echo "Static Pages bundle verified."
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: tiger-scheme-pages-dist
          path: dist/
          if-no-files-found: error
