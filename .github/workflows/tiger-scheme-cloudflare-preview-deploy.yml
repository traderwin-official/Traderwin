name: Tiger Scheme Cloudflare Pages preview deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiger-scheme-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy Tiger Scheme preview
    runs-on: ubuntu-latest
    environment: tiger-scheme-preview
    steps:
      - name: Check out Tiger Scheme branch
        uses: actions/checkout@v4
        with:
          ref: feature/tiger-scheme-cloudflare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run test suite
        run: npm test

      - name: Check Pages Functions syntax
        run: find functions lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build public site
        run: npm run build

      - name: Verify public bundle
        run: |
          test -f dist/index.html
          test -f dist/auth.html
          test -f dist/onboarding.html
          test -f dist/bot-shop.html
          test ! -d dist/api
          test ! -d dist/supabase
          test ! -d dist/lib

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to the tiger-scheme-preview GitHub environment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to the tiger-scheme-preview GitHub environment."; exit 1; }

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tiger-scheme --branch=feature/tiger-scheme-cloudflare
