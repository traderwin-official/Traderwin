name: Traderwin checks
on:
  pull_request:
    branches: [main, upgrade/full-platform-build]
  push:
    branches: [main, upgrade/full-platform-build]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check serverless JavaScript syntax
        run: |
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check inline page scripts
        run: node scripts/check-inline-scripts.mjs
