name: Node.js tests

on:
  pull_request:
    branches: [main, feature/manual-partial-exits, "integration/**"]
  push:
    branches: [main, "feature/**", "integration/**", "fix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run test suite
        run: node --test
