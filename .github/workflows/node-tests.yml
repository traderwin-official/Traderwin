name: Node.js tests

on:
  pull_request:
    branches: [main, "integration/**"]
  push:
    branches: [main, "feature/**", "integration/**", "fix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: node --test
