
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiger Scheme | Account Access</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d17;color:#f4f4f4;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:#111a29;border:1px solid #b58b35;border-radius:16px;padding:28px;box-shadow:0 15px 50px #0008}
h1{color:#e6b84c;text-align:center;margin:0 0 8px}
p{text-align:center;color:#aeb8c8;line-height:1.5}
input{width:100%;padding:14px;margin:8px 0;background:#080d17;border:1px solid #344258;border-radius:8px;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:8px;background:#d7a83c;color:#111;font-weight:bold;font-size:15px;cursor:pointer}
button.secondary{background:#25344a;color:white}
button:disabled{opacity:.5}
#message{padding:12px;border-radius:8px;background:#202c3d;margin-top:15px;display:none;overflow-wrap:anywhere}
#account{display:none;text-align:center}
a{color:#e6b84c}
.small{font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>TIGER SCHEME</h1>
<p>Trade smarter. Manage risk. Grow with discipline.</p>

<div id="auth">
<h2>Welcome</h2>
<p>Create your account or sign in.</p>

<input id="name" type="text" placeholder="Full name (for registration)">
<input id="email" type="email" placeholder="Email address" autocomplete="email" required>
<input id="password" type="password" placeholder="Password (minimum 8 characters)" autocomplete="current-password" required>

<button id="signup">Create Account</button>
<button id="login" class="secondary">Sign In</button>
</div>

<div id="account">
<h2>Account active</h2>
<p id="userEmail"></p>
<p id="accountMode" class="small"></p>
<button id="chooseMode" class="secondary" type="button" onclick="location.href='/onboarding.html'">Choose / Change Account Mode</button>
<button id="logout" class="secondary">Sign Out</button>
</div>

<div id="message" role="status"></div>

<p class="small">Your account is protected by Supabase Authentication. Never share your password or broker credentials.</p>
<p><a href="/">Return to Tiger Scheme dashboard</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://whcmrzdvaiqfmgvlfqxo.supabase.co";
const SUPABASE_KEY = "sb_publishable_EsWQFeqMpYC6ZVexRkCV7Q_qC1tvKJI";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");
const authBox = document.getElementById("auth");
const accountBox = document.getElementById("account");

function showMessage(text) {
  message.style.display = "block";
  message.textContent = text;
}

function setBusy(busy) {
  document.querySelectorAll("button").forEach(button => {
    button.disabled = busy;
  });
}

async function updateAccount() {
  const { data, error } = await client.auth.getUser();

  if (error) {
    showMessage("Unable to check account status.");
    return;
  }

  if (data.user) {
    const { data: profile, error: profileError } = await client
      .from("trader_profiles")
      .select("account_mode")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if (profileError) {
      showMessage("Account-mode setup is not ready. The Tiger Scheme administrator must apply the core upgrade SQL migration in Supabase. " + profileError.message);
      return;
    }

    if (!profile) {
      window.location.replace("/onboarding.html");
      return;
    }

    authBox.style.display = "none";
    accountBox.style.display = "block";
    document.getElementById("userEmail").textContent =
      "Signed in as " + data.user.email;
    document.getElementById("accountMode").textContent =
      "Account mode: " + profile.account_mode + (profile.account_mode === "REAL" ? " — live trading remains locked" : " — practice mode");
  } else {
    authBox.style.display = "block";
    accountBox.style.display = "none";
  }
}

document.getElementById("signup").addEventListener("click", async () => {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!name || !email || password.length < 8) {
    showMessage("Enter your name, email and a password of at least 8 characters.");
    return;
  }

  setBusy(true);
  const { data, error } = await client.auth.signUp({
    email,
    password,
    options: {
      data: { full_name: name }
    }
  });
  setBusy(false);

  if (error) {
    showMessage(error.message);
  } else if (data.session) {
    showMessage("Account created successfully.");
    await updateAccount();
  } else {
    showMessage("Registration received. Check your email for the verification link before signing in.");
  }
});

document.getElementById("login").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter your email and password.");
    return;
  }

  setBusy(true);
  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });
  setBusy(false);

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("Signed in successfully.");
    await updateAccount();
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  setBusy(true);
  const { error } = await client.auth.signOut();
  setBusy(false);

  if (error) {
    showMessage(error.message);
  } else {
    showMessage("You have signed out.");
    await updateAccount();
  }
});

client.auth.onAuthStateChange(() => {
  updateAccount();
});

updateAccount();
</script>
</body>
</html>
